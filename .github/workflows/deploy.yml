name: Deploy to VPS

on:
  push:
    branches:
      - main

# Un seul déploiement à la fois : les pushs rapprochés se mettent en file
# d'attente au lieu de tourner en parallèle (évite les conflits pm2/port 3001).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy sources via rsync
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          ARGS: "-avz --delete --exclude='.env' --exclude='node_modules' --exclude='.next' --exclude='uploads'"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          REMOTE_PORT: ${{ secrets.VPS_PORT }}
          TARGET: "/var/www/hive"

      - name: Build and restart on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          command_timeout: 10m
          script: |
            cd /var/www/hive
            rm -rf .next
            npm install --production=false
            npx prisma generate
            npx prisma db push
            npm run build
            fuser -k 3001/tcp 2>/dev/null || true
            pm2 delete hive 2>/dev/null || true
            sleep 2
            pm2 start npm --name hive -- start
            pm2 save
